[package]
name = "streameroo"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lur1an/streameroo"
keywords = ["amqp", "amqprs", "rabbitmq", "nats", "jetstream"]
description = "Compilation of mini-frameworks & utilities for data-streaming applications"

[dependencies]
thiserror = "2.0.3"
tracing = "0.1.41"

# Codec dependencies (transport-agnostic)
bytes = { version = "1.8.0", optional = true }
rmp-serde = { version = "1.3.0", optional = true }
serde = { version = "1.0.213", optional = true }
serde_json = { version = "1.0.132", optional = true }
bson = { version = "2.13.0", optional = true }

# AMQP dependencies
amqprs = { version = "2.1.1", features = ["urispec"], optional = true }
uuid = { version = "1.11.0", features = ["v4"], optional = true }
tokio = { version = "1.40.0", features = ["full", "rt"], optional = true }
tokio-stream = { version = "0.1.16", optional = true }

# NATS dependencies
async-nats = { version = "0.49.0", optional = true }
tokio-util = { version = "0.7.18", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
futures = { version = "0.3", optional = true }

# Telemetry dependencies
opentelemetry = { version = "0.32", features = [ "trace", ], default-features = false, optional = true }
tracing-opentelemetry-instrumentation-sdk = { version = "0.38", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# Test dependencies (optional, enabled via features)
testcontainers-modules = { version = "0.12.1", features = ["rabbitmq", "nats"], optional = true }
test-context = { version = "0.3.0", optional = true }

[profile.release]
panic = "abort"

[features]
default = ["json"]
amqp = ["dep:amqprs", "dep:uuid", "dep:tokio", "dep:tokio-stream"]
nats = ["dep:async-nats", "dep:tokio", "dep:tokio-util", "dep:futures", "dep:chrono", "dep:serde", "dep:serde_json", "dep:bytes"]
msgpack = ["dep:serde", "dep:rmp-serde"]
json = ["dep:serde", "dep:serde_json"]
bson = ["dep:bson"]
bytes = ["dep:bytes"]
amqp-test = ["amqp", "dep:testcontainers-modules", "dep:test-context"]
telemetry = [
    "dep:opentelemetry",
    "dep:tracing-opentelemetry-instrumentation-sdk",
    "dep:tracing-opentelemetry"
]

[dev-dependencies]
anyhow = "1.0.91"
assert_matches = "1.5.0"
uuid = { version = "1.11.0", features = ["v4"] }
nix = { version = "0.29.0", features = ["process", "signal"] }
test-context = "0.3.0"
testcontainers-modules = { version = "0.12.1", features = ["rabbitmq", "nats"] }
tracing-subscriber = "0.3.19"
init-tracing-opentelemetry = { version = "0.38", features = ["opentelemetry-otlp", "otlp", "tonic", "tracer", "tracing_subscriber_ext"] }
fake-opentelemetry-collector = "0.38"
insta = { version = "1", features = ["yaml", "redactions"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
